server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /config.js {
        expires -1;
        try_files $uri =404;
    }
    
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}